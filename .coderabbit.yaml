# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"
  poem: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_instructions: >
    Use Conventional Commits style (feat:/fix:/docs:/refactor:/test:/chore:),
    concise, matching this repository's commit message convention.
  sequence_diagrams: true
  estimate_code_review_effort: true
  changed_files_summary: true
  collapse_walkthrough: false
  suggested_labels: true
  suggested_reviewers: true
  in_progress_fortune: false
  request_changes_workflow: true
  review_status: true
  commit_status: true
  abort_on_close: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
      - "staging"
      - "develop"

  slop_detection:
    enabled: true
    label: "needs-human-review"

  path_filters:
    - "!**/build/**"
    - "!**/target/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!**/gradlew"
    - "!**/gradlew.bat"
    - "!**/gradle/wrapper/**"

  path_instructions:
    - path: "**/*.java"
      instructions: >
        Apply SOLID principles, Clean Code practices, DRY, KISS, and YAGNI.
        Favor small, single-responsibility methods and classes. Flag
        speculative abstraction or configuration options added without a
        concrete, stated use case (YAGNI) - this project has a strong
        "hardcode before parametrize" discipline and avoids premature
        generalization. Constructor injection only, never field injection
        via bare @Autowired.

    - path: "src/main/java/com/techmath/allcrud/controller/**/*.java"
      instructions: >
        This is the generic CrudController base, extended by consumers via
        codegen or by hand. Keep it thin - orchestration only, no business
        logic. Any new public method should have a clear reason to exist at
        this generic level rather than being left to consumer overrides.

    - path: "src/main/java/com/techmath/allcrud/service/**/*.java"
      instructions: >
        This is the generic CrudService base. Business logic extension
        points (e.g. things consumers are expected to override) should be
        protected, not private, and documented with a clear Javadoc
        explaining when/why to override.

    - path: "src/main/java/com/techmath/allcrud/entity/**/*.java"
      instructions: >
        These are base contracts for consumer entities (AbstractEntity,
        AbstractEntityVO, AuditableEntity), not full entities themselves -
        don't flag missing JPA annotations like @Entity/@Table here, that's
        the consumer's responsibility. Do flag anything that would break
        binary/source compatibility for existing consumers without a clear
        justification, since this is public API surface.

    - path: "**/exception/**/*.java"
      instructions: >
        Exception handling here (AbstractGlobalExceptionHandler,
        BusinessException) is meant to be generic and consumer-agnostic.
        Flag anything that assumes a specific consumer's domain or business
        rules.

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "Conventional Commits style (feat:/fix:/docs:/refactor:/test:), concise, describes the actual change."
    description:
      mode: "warning"
    custom_checks:
      - name: "Real validation over reflection-only"
        mode: "warning"
        instructions: >
          Any change with runtime implications (bean registration,
          serialization, dependency injection, request handling) should be
          validated with a real Spring context or real compilation, not
          reflection-based assertions alone. Flag PRs that only add
          reflection-based tests for changes with runtime implications.
      - name: "No dead code left behind"
        mode: "warning"
        instructions: >
          When a design decision is replaced (e.g. a mechanism superseded,
          a method removed from the public contract), flag any old code
          path, test, or comment that should have been removed but wasn't.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 90000
    pmd:
      enabled: true
    semgrep:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"