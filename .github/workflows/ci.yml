name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube needs full history (blame/authorship) for its analysis - a shallow
          # clone (Actions' default) breaks that.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Full build + test suite, including the real Testcontainers/Docker integration tests -
      # ubuntu-latest ships Docker natively, no extra setup needed for that.
      - name: Build and test
        run: ./gradlew build

      - name: SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
