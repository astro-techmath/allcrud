name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube needs full history (blame/authorship) for its analysis - a shallow
          # clone (Actions' default) breaks that.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Full build + test suite, including the real Testcontainers/Docker integration tests -
      # ubuntu-latest ships Docker natively, no extra setup needed for that.
      #
      # Output captured to a file (not just run directly) so the hint step below can inspect it -
      # PIPESTATUS[0] preserves gradlew's own exit code through the tee pipe (tee's own exit code
      # would otherwise mask a real build failure as success).
      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew build 2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}

      # gradle/verification-metadata.xml records a sha256 per dependency artifact - a Dependabot
      # version bump (dependabot.yml, grouped/weekly) lands with no matching entry until someone
      # regenerates it, and Gradle fails the build with a real but easy-to-miss error. Turning
      # that into an explicit, actionable message here instead of leaving it as a generic build
      # failure - not automated further: workflows triggered by a Dependabot PR run with a
      # read-only GITHUB_TOKEN and no repo secrets by design (GitHub's "pwn request" protection),
      # and regenerating this file means running Gradle against that PR's own build files under
      # write access, which is exactly the privilege-escalation pattern that protection exists to
      # block - not something to route around. See the "Regenerate Dependency Verification
      # Metadata" workflow (workflow_dispatch) for the safe, human-triggered alternative.
      - name: Dependency verification failure hint
        if: failure()
        run: |
          if grep -q "Dependency verification failed" build-output.log; then
            echo "::error title=Dependency verification outdated::A dependency version bump (likely Dependabot) has no matching entry in gradle/verification-metadata.xml. Fix: run './gradlew --write-verification-metadata sha256 build' locally on this branch, commit the updated gradle/verification-metadata.xml, and push to this same PR - or trigger the 'Regenerate Dependency Verification Metadata' workflow against this branch instead."
          fi

      # Workflows triggered by Dependabot run with no repo secrets by design (GitHub's
      # "pwn request" protection, same reasoning as the verification-metadata hint above) -
      # SONAR_TOKEN would be empty and the step would fail regardless. A dependency bump PR
      # also has no new project code to analyze, so skipping is correct, not just a workaround.
      - name: SonarQube analysis
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.token=$SONAR_TOKEN
